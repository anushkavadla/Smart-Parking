spring.application.name=SmartParking
server.port=${PORT:4040}
# Database configuration comes from environment variables.
# Local defaults preserve the existing localhost:4040 <-> MySQL setup;
# the real password MUST be supplied via SPRING_DATASOURCE_PASSWORD and
# must never be committed (see backend/.env.example).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_parking}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# JWT signing secret comes from environment (see backend/.env.example).
# No default is provided on purpose: the app fails fast if it is missing.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}